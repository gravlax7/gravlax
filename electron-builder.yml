appId: com.gravlax.app
productName: Gravlax
directories:
  buildResources: resources
  output: dist
publish:
  provider: github
  owner: gravlax7
  repo: gravlax
  # Keep the release open while each OS job attaches its files. The workflow
  # publishes it only after every job succeeds.
  releaseType: draft
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
mac:
  icon: icon.icns
  category: public.app-category.music
  # Release builds are unsigned until Apple signing and notarization are set up.
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
linux:
  icon: icon.png
  target:
    - AppImage
    - deb
  category: Audio
win:
  icon: icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
